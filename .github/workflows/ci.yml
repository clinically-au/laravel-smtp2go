name: CI

on:
  push:
    branches: [main]
    tags: ['v*', '[0-9]*']
  pull_request:

permissions:
  contents: read

# Public repositories cannot call the private Clinically reusable workflow.
jobs:
  quality:
    name: quality / ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [static, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Pint
        if: matrix.gate == 'static'
        run: vendor/bin/pint --test
      - name: PHPStan
        if: matrix.gate == 'static'
        run: composer analyse
      - name: Tests
        if: matrix.gate == 'tests'
        run: composer test -- --log-junit=build/junit.xml
      - name: Assert test discovery floor
        if: matrix.gate == 'tests'
        run: |
          # shellcheck disable=SC2016
          php -r '$xml = simplexml_load_file("build/junit.xml"); $count = (int) $xml->testsuite["tests"]; if ($count < 20) { fwrite(STDERR, "Only $count tests discovered\n"); exit(1); } echo "Ran $count tests\n";'

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Package source
        id: package
        run: |
          package_name=$(git show HEAD:composer.json | jq -er '.name | select(type == "string" and length > 0)')
          printf 'package_name=%s\n' "$package_name" >> "$GITHUB_OUTPUT"
          git archive --format=zip --prefix=package/ HEAD > "$RUNNER_TEMP/composer.zip"
      - name: Retain Composer archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: composer-${{ github.ref_name }}
          path: ${{ runner.temp }}/composer.zip
          if-no-files-found: error
          compression-level: 0
      - name: Publish Composer archive
        env:
          PACKISTRY_TOKEN: ${{ secrets.PACKISTRY_TOKEN }}
          PACKAGE_NAME: ${{ steps.package.outputs.package_name }}
          VERSION: ${{ github.ref_name }}
        run: |
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 120 \
            --header "Authorization: Bearer $PACKISTRY_TOKEN" \
            --form "file=@$RUNNER_TEMP/composer.zip;type=application/zip" \
            --form-string "version=$VERSION" \
            "https://repo.clindev.au/$PACKAGE_NAME"
